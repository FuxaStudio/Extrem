<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Tréninky — fotogalerie z překážkových tréninků Svídnický Extrém." />
  <link rel="canonical" href="https://svidnickyextrem.cz/galerie-trenink.html" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://svidnickyextrem.cz/galerie-trenink.html" />
  <meta property="og:title" content="Tréninky — Galerie — Svídnický Extrém" />
  <meta property="og:description" content="Tréninky — fotogalerie z překážkových tréninků Svídnický Extrém." />
  <meta property="og:image" content="https://svidnickyextrem.cz/assets/Images/og-Extrem.jpg" />
  <meta property="og:locale" content="cs_CZ" />
  <meta property="og:site_name" content="Svídnický Extrém" />
<link rel="icon" type="image/webp" href="assets/Images/logo2.webp"/>
<title>Tréninky — Galerie — Svídnický Extrém</title>
<link rel="stylesheet" href="assets/shared.css"/>
<link rel="preload" as="image" href="assets/Images/hero.webp" fetchpriority="high"/>
<style>

  .detail-hero {
    position: relative;
    min-height: min(50vh, 480px);
    background: var(--ink);
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden;
  }
  .detail-hero::before {
    content: '';
    position: absolute; inset: 0;
    background-image: url('assets/Images/hero.webp');
    background-size: cover; background-position: center 40%;
    filter: grayscale(0.15) contrast(1.05);
    transform: scale(1.02);
  }
  .detail-hero::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(15,15,15,0.45) 0%, rgba(15,15,15,0.1) 30%, rgba(15,15,15,0.7) 65%, rgba(15,15,15,0.97) 100%),
      linear-gradient(90deg, rgba(15,15,15,0.55) 0%, rgba(15,15,15,0) 60%);
  }
  .detail-hero > .container {
    position: relative; z-index: 2;
    padding-top: 32px;
    padding-bottom: 64px;
    color: var(--paper);
    text-align: center;
  }

  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: rgba(255,255,255,0.6);
    text-decoration: none; transition: color .2s;
    margin-bottom: 40px;
  }
  .back-link:hover { color: var(--paper); }
  .back-link svg { transition: transform .2s; }
  .back-link:hover svg { transform: translateX(-3px); }

  .detail-hero h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(48px, 10vw, 140px);
    line-height: 0.9; letter-spacing: -0.04em;
    text-transform: uppercase;
    margin: 0 0 20px;
    color: var(--paper);
  }
  .detail-hero .event-sub {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.22em;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
  }

  /* ========== FOTO GRID ========== */
  .foto-section { padding: 72px 0 120px; }
  .foto-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .foto-head .eyebrow { margin-bottom: 0; }
  .foto-head .count {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-60);
  }

  .foto-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .foto-grid .f {
    overflow: hidden;
    background: #222;
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    aspect-ratio: 16 / 9;
  }
  .foto-grid .f img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .8s cubic-bezier(.2,.7,.2,1), filter .3s ease;
    filter: grayscale(10%);
  }
  .foto-grid .f:hover img { transform: scale(1.07); filter: grayscale(0%); }

  /* ========== LIGHTBOX ========== */
  #lb {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(10,10,10,0.96);
    align-items: center; justify-content: center;
    flex-direction: column;
  }
  #lb.open { display: flex; }
  #lb img {
    max-width: 92vw; max-height: 88vh;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7);
  }
  #lb-close {
    position: fixed; top: 20px; right: 28px;
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
    background: none; border: none; cursor: pointer;
    transition: color .2s; z-index: 10000;
  }
  #lb-close:hover { color: var(--paper); }
  #lb-prev, #lb-next {
    position: fixed; top: 50%; transform: translateY(-50%);
    background: rgba(245,243,238,0.1); border: none; color: var(--paper);
    width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 2px; transition: background .2s;
  }
  #lb-prev:hover, #lb-next:hover { background: rgba(245,243,238,0.2); }
  #lb-prev { left: 16px; }
  #lb-next { right: 16px; }
  #lb-counter {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(255,255,255,0.4);
  }

  @media (max-width: 900px) {
    .foto-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px) {
    .foto-grid { grid-template-columns: 1fr; gap: 8px; }
  }

  .g-play {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,0.28); transition: background .3s;
  }
  .foto-grid .f:hover .g-play { background: rgba(10,10,10,0.15); }
  .g-play svg { filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); transition: transform .3s; }
  .foto-grid .f:hover .g-play svg { transform: scale(1.12); }

  /* ========== VIDEO LIGHTBOX ========== */
  #vlb {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%; z-index: 9999;
    background: rgba(10,10,10,0.96);
    align-items: center; justify-content: center;
    overscroll-behavior: contain;
  }
  #vlb.open { display: flex; }
  #vlb iframe {
    width: 92vw; height: min(82vh, calc(92vw * 9 / 16));
    border: none; border-radius: 2px; box-shadow: 0 24px 80px rgba(0,0,0,0.8);
  }
  #vlb-close {
    position: fixed; top: 20px; right: 28px;
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
    background: none; border: none; cursor: pointer;
    transition: color .2s; z-index: 10000;
    padding: 10px; min-width: 44px; min-height: 44px;
    display: flex; align-items: center; justify-content: flex-end;
  }
  #vlb-close:hover { color: var(--paper); }
  #vlb-title {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(255,255,255,0.4);
    white-space: nowrap; max-width: 90vw;
    overflow: hidden; text-overflow: ellipsis;
  }
  @media (max-width: 900px) {
    #vlb { flex-direction: column; align-items: stretch; justify-content: flex-start; padding-top: 44px; padding-bottom: env(safe-area-inset-bottom, 20px); box-sizing: border-box; }
    #vlb iframe { width: 100%; flex: 1; min-height: 0; border-radius: 0; box-shadow: none; }
    #vlb-title { display: none; }
    #vlb-close { top: 12px; right: 12px; }
  }

</style>
</head>
<body>

<div id="nav-mount"></div>

<section class="detail-hero">
  <div class="container">
    <a href="galerie.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>
      Zpět na galerii
    </a>
    <h1>Tréninky</h1>
    <div class="event-sub">Svídnický Extrém &mdash; Fotogalerie</div>
  </div>
</section>

<section class="foto-section">
  <div class="container">
    <div class="foto-head">
      <span class="eyebrow">Fotogalerie</span>
      <span class="count">7 fotografií &amp; 2 videa</span>
    </div>
    <div class="foto-grid" id="foto-grid"></div>
  </div>
</section>

<!-- Lightbox -->
<div id="lb">
  <button id="lb-close">✕ Zavřít</button>
  <button id="lb-prev"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg></button>
  <img id="lb-img" src="" alt=""/>
  <button id="lb-next"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg></button>
  <div id="lb-counter"></div>
</div>

<!-- Video Lightbox -->
<div id="vlb">
  <button id="vlb-close">✕ Zavřít</button>
  <iframe id="vlb-iframe" allowfullscreen></iframe>
  <div id="vlb-title"></div>
</div>

<div id="footer-mount"></div>
<script src="assets/shared.js"></script>
<script>
SE.mount('gallery');

const GD = id => `https://drive.google.com/thumbnail?id=${id}&sz=w2000`;
const GV = id => `https://drive.google.com/file/d/${id}/preview`;

const PHOTOS = [
  GD('1A1ZD8qOEprySjGJ30J6MSkvtb_xd0VX7'),
  GD('1p2pSV9ZzJ58hLQnQ16_0jo207JZFk7HC'),
  GD('1n8jJ-rhE6-j1oics9qznvNGWfJql_Bb2'),
  GD('1Y8HwUj91u65jLOh3fCrOh698Eml1pScX'),
  GD('10FzrLj8ERkKN8pOveTsu1aVWq2Tp4Ses'),
  GD('1W9HWy_SlM5CAHcjJtZPZ9_YPvLecG1Iw'),
  GD('13nYnzARN7znfU579Jg59zh_SibHkiPye'),
];

const VIDEOS = [
  { driveId:'1AesuWg3cQX7WOtMgqNt48H4hTk0oXAZX', title:'Tréninky — Dospělí 1' },
  { driveId:'1LGp44f1uUHody5IKgw6uPU7R0J-7dhUQ', title:'Tréninky — Dospělí 2' },
];

const grid = document.getElementById('foto-grid');
grid.innerHTML =
  PHOTOS.map((src, idx) =>
    `<div class="f" data-idx="${idx}"><img src="${src}" alt="Trénink — foto ${idx + 1}" loading="lazy"/></div>`
  ).join('') +
  VIDEOS.map((v, i) => `
  <div class="f" data-vidx="${i}">
    <img src="${GD(v.driveId)}" alt="${v.title}" loading="lazy"/>
    <div class="g-play">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="26" fill="rgba(245,243,238,0.18)"/>
        <polygon points="21,17 38,26 21,35" fill="#fff"/>
      </svg>
    </div>
  </div>`).join('');

const lb = document.getElementById('lb');
const lbImg = document.getElementById('lb-img');
const lbCounter = document.getElementById('lb-counter');
let current = 0;

function openLb(idx) {
  current = idx;
  lbImg.src = PHOTOS[idx];
  lbCounter.textContent = (idx + 1) + ' / ' + PHOTOS.length;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
function prev() { openLb((current - 1 + PHOTOS.length) % PHOTOS.length); }
function next() { openLb((current + 1) % PHOTOS.length); }

grid.addEventListener('click', e => {
  const f = e.target.closest('.f');
  if (!f) return;
  if (f.dataset.vidx !== undefined) openVlb(VIDEOS[+f.dataset.vidx].driveId, VIDEOS[+f.dataset.vidx].title);
  else openLb(+f.dataset.idx);
});
document.getElementById('lb-close').addEventListener('click', closeLb);
document.getElementById('lb-prev').addEventListener('click', prev);
document.getElementById('lb-next').addEventListener('click', next);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') prev();
  if (e.key === 'ArrowRight') next();
  if (e.key === 'Escape') closeLb();
});

const vlb = document.getElementById('vlb');
const vlbIframe = document.getElementById('vlb-iframe');
const vlbTitle = document.getElementById('vlb-title');

let _vlbScrollY = 0;
function openVlb(driveId, title) {
  vlbIframe.src = GV(driveId);
  vlbTitle.textContent = title;
  vlb.classList.add('open');
  _vlbScrollY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${_vlbScrollY}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.overflow = 'hidden';
}
function closeVlb() {
  vlb.classList.remove('open');
  vlbIframe.src = '';
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.overflow = '';
  window.scrollTo(0, _vlbScrollY);
}

document.getElementById('vlb-close').addEventListener('click', closeVlb);
vlb.addEventListener('click', e => { if (e.target === vlb) closeVlb(); });
document.addEventListener('keydown', e => {
  if (vlb.classList.contains('open') && e.key === 'Escape') closeVlb();
});
</script>
</body>
</html>
