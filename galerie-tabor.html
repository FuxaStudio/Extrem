<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Letní tábor — fotogalerie z táborového programu Svídnický Extrém." />
<link rel="icon" type="image/png" href="assets/Images/logo2.jpeg"/>
<title>Tábor — Galerie — Svídnický Extrém</title>
<link rel="stylesheet" href="assets/shared.css"/>
<style>

  .detail-hero {
    position: relative;
    min-height: min(50vh, 480px);
    background: var(--ink);
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden;
  }
  .detail-hero::before {
    content: '';
    position: absolute; inset: 0;
    background-image: url('https://drive.google.com/thumbnail?id=1FxJwqDDXluwSnJ3hiXyPPwYUNGewyPCi&sz=w2000');
    background-size: cover; background-position: center 35%;
    filter: grayscale(0.15) contrast(1.05);
    transform: scale(1.02);
  }
  .detail-hero::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(15,15,15,0.45) 0%, rgba(15,15,15,0.1) 30%, rgba(15,15,15,0.7) 65%, rgba(15,15,15,0.97) 100%),
      linear-gradient(90deg, rgba(15,15,15,0.55) 0%, rgba(15,15,15,0) 60%);
  }
  .detail-hero > .container {
    position: relative; z-index: 2;
    padding-top: 32px;
    padding-bottom: 64px;
    color: var(--paper);
    text-align: center;
  }

  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: rgba(255,255,255,0.6);
    text-decoration: none; transition: color .2s;
    margin-bottom: 40px;
  }
  .back-link:hover { color: var(--paper); }
  .back-link svg { transition: transform .2s; }
  .back-link:hover svg { transform: translateX(-3px); }

  .detail-hero h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(48px, 10vw, 140px);
    line-height: 0.9; letter-spacing: -0.04em;
    text-transform: uppercase;
    margin: 0 0 20px;
    color: var(--paper);
  }
  .detail-hero .event-sub {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.22em;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
  }

  /* ========== VIDEO GRID ========== */
  .video-section { padding: 72px 0 120px; }
  .video-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .video-head .eyebrow { margin-bottom: 0; }
  .video-head .count {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-60);
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .video-grid .v {
    overflow: hidden;
    background: #222;
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    aspect-ratio: 16 / 9;
  }
  .video-grid .v video {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .8s cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
  }
  .video-grid .v:hover video { transform: scale(1.06); }

  .g-play {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,0.28);
    transition: background .3s;
  }
  .video-grid .v:hover .g-play { background: rgba(10,10,10,0.15); }
  .g-play svg { filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); transition: transform .3s; }
  .video-grid .v:hover .g-play svg { transform: scale(1.12); }

  /* foto položka v gridu */
  .video-grid .f {
    overflow: hidden;
    background: #222;
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    aspect-ratio: 16 / 9;
  }
  .video-grid .f img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .8s cubic-bezier(.2,.7,.2,1), filter .3s ease;
    filter: grayscale(10%);
  }
  .video-grid .f:hover img { transform: scale(1.06); filter: grayscale(0%); }

  /* foto lightbox */
  #flb {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(10,10,10,0.96);
    align-items: center; justify-content: center;
  }
  #flb.open { display: flex; }
  #flb img {
    max-width: 92vw; max-height: 88vh;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.8);
  }
  #flb-close {
    position: fixed; top: 20px; right: 28px;
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
    background: none; border: none; cursor: pointer;
    transition: color .2s; z-index: 10000;
  }
  #flb-close:hover { color: var(--paper); }

  /* ========== LIGHTBOX ========== */
  #vlb {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(10,10,10,0.96);
    align-items: center; justify-content: center;
  }
  #vlb.open { display: flex; }
  #vlb iframe {
    width:92vw; height:min(86vh,calc(92vw * 9/16)); border:none; border-radius:2px; box-shadow:0 24px 80px rgba(0,0,0,0.8);
  }
  #vlb-close {
    position: fixed; top: 20px; right: 28px;
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
    background: none; border: none; cursor: pointer;
    transition: color .2s; z-index: 10000;
  }
  #vlb-close:hover { color: var(--paper); }
  #vlb-title {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(255,255,255,0.4);
    white-space: nowrap;
  }

  @media (max-width: 700px) {
    .video-grid { grid-template-columns: 1fr; gap: 8px; }
  }

</style>
</head>
<body>

<div id="nav-mount"></div>

<section class="detail-hero">
  <div class="container">
    <a href="galerie.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>
      Zpět na galerii
    </a>
    <h1>Tábor</h1>
    <div class="event-sub">Svídnický Extrém &mdash; Videoukázky</div>
  </div>
</section>

<section class="video-section">
  <div class="container">
    <div class="video-head">
      <span class="eyebrow">Galerie</span>
      <span class="count">3 videa &amp; 1 fotografie</span>
    </div>
    <div class="video-grid" id="vgrid"></div>
  </div>
</section>

<!-- Foto lightbox -->
<div id="flb">
  <button id="flb-close">✕ Zavřít</button>
  <img id="flb-img" src="" alt=""/>
</div>

<!-- Video lightbox -->
<div id="vlb">
  <button id="vlb-close">✕ Zavřít</button>
  <iframe id="vlb-iframe" allowfullscreen></iframe>
  <div id="vlb-title"></div>
</div>

<div id="footer-mount"></div>
<script src="assets/shared.js"></script>
<script>
SE.mount('gallery');

const GD = id => `https://drive.google.com/thumbnail?id=&sz=w2000&${id}`;
const GV = id => `https://drive.google.com/file/d/${id}/preview`;

const VIDEOS = [
  { driveId:'1WIadPwCwUL1dEn44mxqxFQNPQWFLJrEa', poster:GD('1FxJwqDDXluwSnJ3hiXyPPwYUNGewyPCi'), title:'Tábor 1' },
  { driveId:'1WVLxSd2xku-t07sp1jyW8J77JQ2Ft5O1', poster:GD('1FxJwqDDXluwSnJ3hiXyPPwYUNGewyPCi'), title:'Tábor 2' },
  { driveId:'1crX7GZ7dA89ZDPEXJoZ-f9kPLpVrQo_M', poster:GD('1FxJwqDDXluwSnJ3hiXyPPwYUNGewyPCi'), title:'Tábor 3' },
];
const FOTO_SRC = GD('1FxJwqDDXluwSnJ3hiXyPPwYUNGewyPCi');

const vgrid = document.getElementById('vgrid');
vgrid.innerHTML = VIDEOS.map((v, i) => `
  <div class="v" data-idx="${i}">
    <img src="${v.poster}" alt="${v.title}" loading="lazy" style="width:100%;height:100%;object-fit:cover;"/>
    <div class="g-play">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="26" fill="rgba(245,243,238,0.18)"/>
        <polygon points="21,17 38,26 21,35" fill="#fff"/>
      </svg>
    </div>
  </div>`).join('')
  + `<div class="f" id="foto-item">
      <img src="${FOTO_SRC}" alt="Tábor" loading="lazy"/>
    </div>`;

// Video lightbox
const vlb = document.getElementById('vlb');
const vlbIframe = document.getElementById('vlb-iframe');
const vlbTitle = document.getElementById('vlb-title');

function openVlb(driveId, title) {
  vlbIframe.src = GV(driveId);
  vlbTitle.textContent = title;
  vlb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeVlb() {
  vlb.classList.remove('open');
  vlbIframe.src = '';
  document.body.style.overflow = '';
}

vgrid.querySelectorAll('.v').forEach(card => {
  const idx = +card.dataset.idx;
  card.addEventListener('click', () => openVlb(VIDEOS[idx].driveId, VIDEOS[idx].title));
});

document.getElementById('vlb-close').addEventListener('click', closeVlb);
vlb.addEventListener('click', e => { if (e.target === vlb) closeVlb(); });

// Foto lightbox
const flb = document.getElementById('flb');
const flbImg = document.getElementById('flb-img');
document.getElementById('foto-item').addEventListener('click', () => {
  flbImg.src = FOTO_SRC;
  flb.classList.add('open');
  document.body.style.overflow = 'hidden';
});
document.getElementById('flb-close').addEventListener('click', () => {
  flb.classList.remove('open');
  document.body.style.overflow = '';
});
flb.addEventListener('click', e => {
  if (e.target === flb) { flb.classList.remove('open'); document.body.style.overflow = ''; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (vlb.classList.contains('open')) closeVlb();
    if (flb.classList.contains('open')) { flb.classList.remove('open'); document.body.style.overflow = ''; }
  }
});
</script>
</body>
</html>
