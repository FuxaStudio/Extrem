<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Vítání prázdnin ve Svídnici — fotogalerie z akce Svídnický Extrém." />
<link rel="icon" type="image/png" href="assets/Images/logo2.jpeg"/>
<title>Vítání prázdnin 2025 — Fotogalerie — Svídnický Extrém</title>
<link rel="stylesheet" href="assets/shared.css"/>
<style>

  .detail-hero {
    position: relative;
    min-height: min(55vh, 520px);
    background: var(--ink);
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden;
  }
  .detail-hero::before {
    content: '';
    position: absolute; inset: 0;
    background-image: url('https://drive.google.com/thumbnail?id=1SigHJA1tE2He5eztIRgBWbxPYJ4xY78g&sz=w2000');
    background-size: cover; background-position: center 35%;
    filter: grayscale(0.15) contrast(1.05);
    transform: scale(1.02);
  }
  .detail-hero::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(15,15,15,0.45) 0%, rgba(15,15,15,0.1) 30%, rgba(15,15,15,0.7) 65%, rgba(15,15,15,0.97) 100%),
      linear-gradient(90deg, rgba(15,15,15,0.55) 0%, rgba(15,15,15,0) 60%);
  }
  .detail-hero > .container {
    position: relative; z-index: 2;
    padding-top: 32px;
    padding-bottom: 64px;
    color: var(--paper);
    text-align: center;
  }

  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: rgba(255,255,255,0.6);
    text-decoration: none; transition: color .2s;
    margin-bottom: 40px;
  }
  .back-link:hover { color: var(--paper); }
  .back-link svg { transition: transform .2s; }
  .back-link:hover svg { transform: translateX(-3px); }

  .detail-hero h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(48px, 10vw, 140px);
    line-height: 0.9; letter-spacing: -0.04em;
    text-transform: uppercase;
    margin: 0 0 20px;
    color: var(--paper);
  }
  .detail-hero .event-date {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.22em;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
  }

  /* ========== PHOTO GRID ========== */
  .foto-section { padding: 72px 0 120px; }
  .foto-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 32px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .foto-head .eyebrow { margin-bottom: 0; }
  .foto-head .count {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-60);
  }

  .foto-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .foto-grid .f {
    overflow: hidden;
    background: #222;
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    aspect-ratio: 3 / 2;
  }
  .foto-grid .f img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .8s cubic-bezier(.2,.7,.2,1), filter .3s ease;
    filter: grayscale(10%);
  }
  .foto-grid .f:hover img { transform: scale(1.07); filter: grayscale(0%); }

  /* lightbox */
  #lb {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(10,10,10,0.95);
    align-items: center; justify-content: center;
    flex-direction: column;
  }
  #lb.open { display: flex; }
  #lb img {
    max-width: 92vw; max-height: 88vh;
    object-fit: contain;
    border-radius: 2px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7);
  }
  #lb-close {
    position: fixed; top: 20px; right: 28px;
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
    background: none; border: none; cursor: pointer;
    transition: color .2s;
  }
  #lb-close:hover { color: var(--paper); }
  #lb-prev, #lb-next {
    position: fixed; top: 50%; transform: translateY(-50%);
    background: rgba(245,243,238,0.1); border: none; color: var(--paper);
    width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; border-radius: 2px; transition: background .2s;
  }
  #lb-prev:hover, #lb-next:hover { background: rgba(245,243,238,0.2); }
  #lb-prev { left: 16px; }
  #lb-next { right: 16px; }
  #lb-counter {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(255,255,255,0.4);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 900px) {
    .foto-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px) {
    .foto-grid { grid-template-columns: 1fr; gap: 6px; }
  }

</style>
</head>
<body>

<div id="nav-mount"></div>

<section class="detail-hero">
  <div class="container">
    <a href="galerie.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>
      Zpět na galerii
    </a>
    <h1>Vítání<br>prázdnin</h1>
    <div class="event-date">22. června 2025 &mdash; Svídnice</div>
  </div>
</section>

<section class="foto-section">
  <div class="container">
    <div class="foto-head">
      <span class="eyebrow">Fotogalerie</span>
      <span class="count" id="photo-count"></span>
    </div>
    <div class="foto-grid" id="foto-grid"></div>
  </div>
</section>

<!-- Lightbox -->
<div id="lb">
  <button id="lb-close">✕ Zavřít</button>
  <button id="lb-prev"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3L5 8l5 5"/></svg></button>
  <img id="lb-img" src="" alt=""/>
  <button id="lb-next"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3l5 5-5 5"/></svg></button>
  <div id="lb-counter"></div>
</div>

<div id="footer-mount"></div>
<script src="assets/shared.js"></script>
<script>
SE.mount('gallery');

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_0fUi-nEI9Na_B3E9aW2pGrt9GZk4L1Hb_pFsApWzqRLPA6o3w0yLYSKVHYbM82B3/exec';

const BATCH = 40;
const CACHE_KEY = 'vitani-ids';
const CACHE_TTL = 24 * 60 * 60 * 1000;

function getCached() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const { ts, ids } = JSON.parse(raw);
    if (Date.now() - ts > CACHE_TTL) return null;
    return ids;
  } catch { return null; }
}

function setCached(ids) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), ids })); } catch {}
}

function renderPhotos(ids) {
  const grid = document.getElementById('foto-grid');
  const total = ids.length;
  document.getElementById('photo-count').textContent = total + ' fotografií';

  const thumbs = ids.map(id => `https://drive.google.com/thumbnail?id=${id}&sz=w600`);
  const fulls  = ids.map(id => `https://drive.google.com/thumbnail?id=${id}&sz=w2000`);

  let loaded = 0;
  function renderBatch() {
    const end = Math.min(loaded + BATCH, total);
    const frag = document.createDocumentFragment();
    for (let i = loaded; i < end; i++) {
      const div = document.createElement('div');
      div.className = 'f';
      div.dataset.idx = i;
      div.innerHTML = `<img src="${thumbs[i]}" alt="Vítání prázdnin 2025 — foto ${i+1}" loading="lazy"/>`;
      frag.appendChild(div);
    }
    grid.appendChild(frag);
    loaded = end;
  }

  renderBatch();
  setupLightbox(fulls, total);

  const sentinel = document.createElement('div');
  grid.after(sentinel);
  const obs = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting && loaded < total) {
      renderBatch();
      if (loaded >= total) obs.disconnect();
    }
  }, { rootMargin: '400px' });
  obs.observe(sentinel);
}

async function loadPhotos() {
  const grid = document.getElementById('foto-grid');

  const cached = getCached();
  if (cached) {
    renderPhotos(cached);
    return;
  }

  grid.innerHTML = `<div style="grid-column:1/-1;display:flex;justify-content:center;padding:60px 0;">
    <div style="width:40px;height:40px;border:3px solid rgba(245,243,238,0.15);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;"></div>
  </div>`;

  try {
    const res = await fetch(SCRIPT_URL);
    if (!res.ok) throw new Error('Script error');
    const ids = await res.json();
    setCached(ids);
    grid.innerHTML = '';
    renderPhotos(ids);
  } catch(e) {
    grid.innerHTML = `<p style="color:rgba(245,243,238,0.5);font-family:var(--mono);grid-column:1/-1;text-align:center;padding:40px 0;">Fotografie se nepodařilo načíst.</p>`;
  }
}

function setupLightbox(srcs, total) {
  const lb = document.getElementById('lb');
  const lbImg = document.getElementById('lb-img');
  const lbCounter = document.getElementById('lb-counter');
  let current = 0;
  function openLb(idx) {
    current = idx;
    lbImg.src = srcs[idx];
    lbCounter.textContent = (idx + 1) + ' / ' + total;
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  function prev() { openLb((current - 1 + total) % total); }
  function next() { openLb((current + 1) % total); }
  document.getElementById('foto-grid').addEventListener('click', e => {
    const f = e.target.closest('.f');
    if (f) openLb(+f.dataset.idx);
  });
  document.getElementById('lb-close').addEventListener('click', closeLb);
  document.getElementById('lb-prev').addEventListener('click', prev);
  document.getElementById('lb-next').addEventListener('click', next);
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
    if (e.key === 'Escape') closeLb();
  });
}

loadPhotos();
</script>
</body>
</html>
