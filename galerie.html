<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Galerie Svídnický Extrém — fotky a videa ze závodů, letního tábora, dětských tréninků a závodů." />
<link rel="icon" type="image/png" href="assets/Images/logo2.jpeg"/>
<title>Galerie — Svídnický Extrém</title>
<link rel="stylesheet" href="assets/shared.css"/>
<link rel="preload" as="image" href="https://images.unsplash.com/photo-1522866348293-55be2c6caa1f?auto=format&fit=crop&w=1920&q=80" fetchpriority="high"/>
<style>
  .page-header--hero {
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.35) 100%),
      url('https://images.unsplash.com/photo-1522866348293-55be2c6caa1f?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
  }

  .filters { padding: 48px 0 24px; border-bottom: 1px solid var(--line); }
  .f-row { display:flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
  .f-chips { display:flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--display); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; font-size: 14px;
    padding: 10px 18px; border: 1.5px solid var(--line); border-radius: 2px;
    background: transparent; cursor: pointer; color: var(--ink-80);
    transition: all .2s ease;
  }
  .chip:hover { border-color: var(--ink); color: var(--ink); }
  .chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chip .n { font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em; opacity: 0.55; line-height: 1; margin-left: 4px; }


  .gal-wrap { padding: 48px 0 120px; }
  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .gallery .g {
    overflow: hidden;
    background: #222;
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    transition: opacity .3s ease, transform .3s ease;
    text-decoration: none;
    display: block;
    aspect-ratio: 16 / 9;
  }
  .gallery .g.hidden { display: none; }
  .gallery .g img {
    width:100%; height:100%; object-fit: cover;
    transition: transform .8s cubic-bezier(.2,.7,.2,1), filter .3s ease;
    filter: grayscale(15%);
  }
  .gallery .g:hover img { transform: scale(1.06); filter: grayscale(0%); }
  .gallery .g .meta {
    position: absolute; left: 12px; bottom: 12px; right: 12px;
    display:flex; justify-content: flex-start; align-items: end;
    opacity: 0; transition: opacity .3s ease;
  }
  .gallery .g:hover .meta { opacity: 1; }
  .gallery .g .meta .t {
    background: rgba(15,15,15,0.75); backdrop-filter: blur(6px);
    color: var(--paper); padding: 6px 10px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .gallery .g .date-stamp {
    position: absolute; right: 12px; bottom: 12px;
    background: var(--accent); color: #fff;
    padding: 5px 9px;
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
    opacity: 0; transition: opacity .3s ease, transform .3s ease;
    transform: translateY(4px);
  }
  .gallery .g:hover .date-stamp { opacity: 1; transform: translateY(0); }
  .gallery .g .cat-tag {
    position: absolute; left: 12px; top: 12px;
    background: var(--paper); color: var(--ink);
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 5px 9px;
    max-width: calc(100% - 24px);
  }

  @media (max-width: 700px){
    .gallery { grid-template-columns: 1fr; gap: 8px; }
    .gallery .g .date-stamp,
    .gallery .g .meta { display: none; }
  }

  /* video items */
  .gallery .g video {
    width:100%; height:100%; object-fit: cover;
    transition: transform .8s cubic-bezier(.2,.7,.2,1);
    pointer-events: none;
  }
  .gallery .g:hover video { transform: scale(1.06); }
  .g-play {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,0.28);
    transition: background .3s;
  }
  .gallery .g:hover .g-play { background: rgba(10,10,10,0.15); }
  .g-play svg { filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); transition: transform .3s; }
  .gallery .g:hover .g-play svg { transform: scale(1.12); }

  /* video lightbox */
  #vlb {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(10,10,10,0.96);
    align-items: center; justify-content: center;
  }
  #vlb.open { display: flex; }
  #vlb iframe {
    width:92vw; height:min(86vh,calc(92vw * 9/16)); border:none; border-radius:2px; box-shadow:0 24px 80px rgba(0,0,0,0.8);
  }
  #vlb-close {
    position: fixed; top: 20px; right: 28px;
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(255,255,255,0.5);
    background: none; border: none; cursor: pointer;
    transition: color .2s; z-index: 10000;
  }
  #vlb-close:hover { color: var(--paper); }
  #vlb-title {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: rgba(255,255,255,0.4);
    white-space: nowrap;
  }


</style>
</head>
<body>

<div id="nav-mount"></div>

<section class="page-header page-header--hero">
  <div class="container">
    <h1>Galerie.</h1>
  </div>
</section>

<section class="filters">
  <div class="container">
    <div class="f-row">
      <div class="f-chips" id="chips">
        <button class="chip active" data-cat="all">Vše <span class="n">9</span></button>
        <button class="chip" data-cat="zavody">Závody <span class="n">4</span></button>
        <button class="chip" data-cat="akce">Akce <span class="n">3</span></button>
        <button class="chip" data-cat="deti">Děti <span class="n">1</span></button>
        <button class="chip" data-cat="trenink">Tréninky <span class="n">1</span></button>
      </div>
    </div>
  </div>
</section>

<section class="gal-wrap">
  <div class="container">
    <div class="gallery" id="gallery">
      <!-- generated by JS below -->
    </div>
  </div>
</section>

<!-- Video lightbox -->
<div id="vlb">
  <button id="vlb-close">✕ Zavřít</button>
  <iframe id="vlb-iframe" allowfullscreen></iframe>
  <div id="vlb-title"></div>
</div>

<div id="footer-mount"></div>
<script src="assets/shared.js"></script>
<script>SE.mount('gallery');

const GD = id => `https://drive.google.com/thumbnail?id=${id}&sz=w2000`;
const GV = id => `https://drive.google.com/file/d/${id}/preview`;

const ITEMS = [
  {type:'local', src:'assets/Images/hero-galerie.jpg', cat:'akce', title:'Vítání prázdnin 2025', date:'22. 6. 2025', link:'galerie-detail.html', tag:'Vítání prázdnin', eager:true},
  {type:'local', src:'assets/Images/hero-treninky.jpg', cat:'trenink', title:'Tréninky', date:'', link:'galerie-trenink.html', tag:'Tréninky', eager:true},
  {type:'video', driveId:'1IBOmaRZVYZ8LGd8fLyeWCmkzFg0tBHmD', poster:GD('1IBOmaRZVYZ8LGd8fLyeWCmkzFg0tBHmD'), cat:'zavody', title:'Svídnický Extrém 2025', date:'2025', tag:'Svídnický Extrém'},
  {type:'video', driveId:'19EdnI1ToHe4tZUi8ASXjCZ-SEecgA3Xt', poster:GD('19EdnI1ToHe4tZUi8ASXjCZ-SEecgA3Xt'), cat:'zavody', title:'Extrém 2024', date:'2024', tag:'Svídnický Extrém'},
  {type:'video', driveId:'1Pari3VR6KzaO-ABjy7e_DhR-YPmGZMzI', poster:GD('1Pari3VR6KzaO-ABjy7e_DhR-YPmGZMzI'), cat:'zavody', title:'Svídnický Extrém 2022', date:'2022', tag:'Svídnický Extrém'},
  {type:'video', driveId:'1EwBdbDuBMzB_0uMIcF9bIEP2I5COiJsq', poster:GD('1ZghbFcNtw4h0mBDCaU2wbzlZ3823IcpB'), cat:'zavody', title:'Závod — záběry 2025', date:'2025', tag:'Svídnický Extrém'},
  {type:'video', driveId:'1846MJYDjJLj6IMlHAoN-CSC5X14sjosX', poster:GD('1846MJYDjJLj6IMlHAoN-CSC5X14sjosX'), cat:'akce', title:'Vánoční běh 2025', date:'2025', tag:'Vánoční běh'},
  {type:'local', src:GD('1FxJwqDDXluwSnJ3hiXyPPwYUNGewyPCi'), cat:'akce', title:'Tábor', date:'', link:'galerie-tabor.html', tag:'Tábor'},
  {type:'local', src:GD('1JA19b6dlUbpLOtoAMs4pwetFjjNsTP2y'), cat:'deti', title:'Děti — Extrém', date:'', link:'galerie-deti.html', tag:'Děti — Extrém'},
];

const CATS = {all:'Vše', 'trenink-dospeli':'Trénink - Dospělí', 'trenink-deti':'Trénink - Děti', zavody:'Závod', akce:'Akce', deti:'Děti', trenink:'Tréninky'};

function renderItem(im) {
  if (im.type === 'video') {
    const inner = `<img src="${im.poster}" alt="${im.title}" ${im.eager ? 'fetchpriority="high"' : 'loading="lazy"'} style="width:100%;height:100%;object-fit:cover;"/>
      <div class="g-play">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
          <circle cx="26" cy="26" r="26" fill="rgba(245,243,238,0.18)"/>
          <polygon points="21,17 38,26 21,35" fill="#fff"/>
        </svg>
      </div>
      <div class="cat-tag">${CATS[im.cat]}</div>
      ${im.date ? `<div class="date-stamp">${im.date}</div>` : ''}
      <div class="meta"><span class="t">${im.tag || im.title}</span></div>`;
    if (im.link) {
      return `<a class="g ${im.size||''}" data-cat="${im.cat}" href="${im.link}" data-driveid="${im.driveId}">${inner}</a>`;
    }
    return `<div class="g ${im.size||''}" data-cat="${im.cat}" data-driveid="${im.driveId}">${inner}</div>`;
  }
  const imgSrc = im.src;
  if (im.link) {
    return `<a class="g ${im.size||''}" data-cat="${im.cat}" href="${im.link}">
      <img src="${imgSrc}" alt="${im.title}" ${im.eager ? 'fetchpriority="high"' : 'loading="lazy"'}/>
      <div class="cat-tag">${CATS[im.cat]}</div>
      ${im.date ? `<div class="date-stamp">${im.date}</div>` : ''}
      <div class="meta"><span class="t">${im.tag || im.title}</span></div>
    </a>`;
  }
  return `<div class="g ${im.size||''}" data-cat="${im.cat}">
    <img src="${imgSrc}" alt="${im.title}" ${im.eager ? 'fetchpriority="high"' : 'loading="lazy"'}/>
    <div class="cat-tag">${CATS[im.cat]}</div>
    <div class="date-stamp">${im.date}</div>
    <div class="meta"><span class="t">${im.tag || im.title}</span></div>
  </div>`;
}

const g = document.getElementById('gallery');
g.innerHTML = ITEMS.map(renderItem).join('');

// Video lightbox
const vlb = document.getElementById('vlb');
const vlbIframe = document.getElementById('vlb-iframe');
const vlbTitle = document.getElementById('vlb-title');

function openVlb(driveId, title) {
  vlbIframe.src = GV(driveId);
  vlbTitle.textContent = title;
  vlb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeVlb() {
  vlb.classList.remove('open');
  vlbIframe.src = '';
  document.body.style.overflow = '';
}

g.querySelectorAll('.g[data-driveid]').forEach(card => {
  if (card.tagName === 'A') return; // link karty navigují přímo
  const driveId = card.dataset.driveid;
  const title = card.querySelector('.meta .t')?.textContent || '';
  card.addEventListener('click', () => openVlb(driveId, title));
});

document.getElementById('vlb-close').addEventListener('click', closeVlb);
vlb.addEventListener('click', e => { if (e.target === vlb) closeVlb(); });
document.addEventListener('keydown', e => {
  if (vlb.classList.contains('open') && e.key === 'Escape') closeVlb();
});

const chips = document.querySelectorAll('#chips .chip');
chips.forEach(c => c.addEventListener('click', () => {
  chips.forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  const cat = c.dataset.cat;
  document.querySelectorAll('#gallery .g').forEach(el => {
    const match = cat === 'all' || el.dataset.cat === cat;
    el.classList.toggle('hidden', !match);
  });
}));
</script>
</body>
</html>
